[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "container-workbench"
version = "0.1.0"
description = "Offline spreadsheet comparison desktop application"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "pandas>=2.1", "openpyxl>=3.1", "pydantic>=2.5", "xlrd>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.11"]

[tool.setuptools.packages.find]
include = ["app*", "ui*", "services*", "ai*", "models*", "infrastructure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
